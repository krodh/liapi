[project]
name = "linkedin-profile-api"
version = "0.1.0"
description = "Reverse-engineered LinkedIn profile API over the Voyager endpoints."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "curl-cffi>=0.7",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.15",
]

[project.optional-dependencies]
# Browser-assisted session capture (`liapi capture`). Setup-time only - the
# API never launches a browser. Install with: uv sync --extra capture
capture = ["playwright>=1.62"]

[project.scripts]
liapi = "app.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
